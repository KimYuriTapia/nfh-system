<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Fairway HOA - Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="brand-side">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="brand-logo">
            </div>
            <h1>North Fairway Homes</h1>
            <p>Homeowners Association Inc.</p>
        </div>

        <div class="form-side">
            <!-- SIGN IN FORM -->
            <div id="signin-box" class="form-box active">
                <h2>Welcome Back</h2>
                <p class="form-subtitle">Please sign in to access your portal</p>

                <form id="signin-form">
                    <div class="input-group full-width">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" placeholder="Enter your username" required>
                    </div>
                    <div class="input-group full-width">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-submit" id="btn-signin-submit">Sign In</button>
                </form>

                <p class="toggle-text">
                    Don't have an account? <a href="#" id="to-signup">Sign Up</a>
                </p>
            </div>

            <!-- SIGN UP FORM -->
            <div id="signup-box" class="form-box" style="display: none;">
                <h2>Create Account</h2>
                <p class="form-subtitle">Register for a new homeowner account</p>

                <form id="signup-form" class="form-grid">
                    <div class="input-group">
                        <label for="reg-first">First Name</label>
                        <input type="text" id="reg-first" placeholder="John" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-last">Last Name</label>
                        <input type="text" id="reg-last" placeholder="Doe" required>
                    </div>
                    <div class="input-group full-width">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" placeholder="john.doe@domain.com" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-user">Username</label>
                        <input type="text" id="reg-user" placeholder="johndoe99" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="tel" id="reg-phone" placeholder="+63 900 000 0000" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-pass">Password</label>
                        <input type="password" id="reg-pass" placeholder="••••••••" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-pass-confirm">Confirm Password</label>
                        <input type="password" id="reg-pass-confirm" placeholder="••••••••" required>
                    </div>
                    <div class="full-width">
                        <button type="submit" class="btn-submit" id="btn-signup-submit">Sign Up</button>
                    </div>
                </form>

                <p class="toggle-text">
                    Already have an account? <a href="#" id="to-signin">Sign In</a>
                </p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
